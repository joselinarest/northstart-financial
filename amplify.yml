version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - corepack enable
        - corepack prepare pnpm@11.19.0 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - test -n "$NEXT_PUBLIC_COGNITO_DOMAIN" || (echo "Missing Amplify variable NEXT_PUBLIC_COGNITO_DOMAIN" && exit 1)
        - test -n "$NEXT_PUBLIC_COGNITO_CLIENT_ID" || (echo "Missing Amplify variable NEXT_PUBLIC_COGNITO_CLIENT_ID" && exit 1)
        - test -n "$COGNITO_ISSUER" || (echo "Missing Amplify variable COGNITO_ISSUER" && exit 1)
        - test -n "$COGNITO_USER_POOL_ID" || (echo "Missing Amplify variable COGNITO_USER_POOL_ID" && exit 1)
        - printf 'NEXT_PUBLIC_COGNITO_DOMAIN=%s\nNEXT_PUBLIC_COGNITO_CLIENT_ID=%s\nCOGNITO_ISSUER=%s\nCOGNITO_USER_POOL_ID=%s\nCOGNITO_CLIENT_ID=%s\n' "$NEXT_PUBLIC_COGNITO_DOMAIN" "$NEXT_PUBLIC_COGNITO_CLIENT_ID" "$COGNITO_ISSUER" "$COGNITO_USER_POOL_ID" "$NEXT_PUBLIC_COGNITO_CLIENT_ID" > .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .pnpm-store/**/*
      - node_modules/**/*
